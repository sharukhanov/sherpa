<style id="page-style">
/* Layout: шапка отчёта + сетка 2×2 из блоков проекта; на телефоне блоки идут в одну колонку */
:root {
  --bg: #f3f6fb;
  --panel: #ffffff;
  --ink: #16213a;
  --muted: #66728a;
  --line: #e2e7f0;
  --cell: #f7f9fc;

  --c1: #3d8be0; --c1-soft: #e9f2fd;   /* корпоративные инструменты */
  --c2: #3aa982; --c2-soft: #e6f5ef;   /* база знаний */
  --c3: #f08a3c; --c3-soft: #fdf0e5;   /* закупочные процедуры */
  --c4: #7a6fcf; --c4-soft: #efedfb;   /* общие вопросы */

  --s-green-bg: #e3f4ea;  --s-green-fg: #1f7a48;
  --s-yellow-bg: #fdf1d9;   --s-yellow-fg: #9a6200;
  --s-blue-bg: #e4eefc;  --s-blue-fg: #2459a8;
  --s-red-bg: #fde6e4; --s-red-fg: #b3382d;
  --s-violet-bg: #efe9fc;  --s-violet-fg: #5c3fb0;
  --s-teal-bg: #e1f4f6;   --s-teal-fg: #1d7381;
  --s-grey-bg: #eceff4;   --s-grey-fg: #4f5a6d;

  /* отметка изменений с прошлого отчёта */
  --chg: #c0247f; --chg-bg: #fdebf5;

  --f-display: "Manrope", "Segoe UI", system-ui, sans-serif;
  --f-body: "PT Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1522; --panel: #171f30; --ink: #e6ebf5; --muted: #95a1b8; --line: #263149; --cell: #1c2538;
    --c1: #6aa9ee; --c1-soft: #1b2a42; --c2: #5cc39d; --c2-soft: #17302a;
    --c3: #f4a165; --c3-soft: #33251a; --c4: #9d94e6; --c4-soft: #252340;
    --s-green-bg: #173827; --s-green-fg: #7fd8a5; --s-yellow-bg: #3a2d12; --s-yellow-fg: #f2c46b;
    --s-blue-bg: #1a2c4a; --s-blue-fg: #8fb8f2; --s-red-bg: #3f1d1b; --s-red-fg: #f19a90;
    --s-violet-bg: #2a2147; --s-violet-fg: #bba8f5; --s-teal-bg: #15353a; --s-teal-fg: #7fd0dc;
    --s-grey-bg: #262d3a; --s-grey-fg: #b0b9c9; --chg: #f07cc4; --chg-bg: #3a1a30;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1522; --panel: #171f30; --ink: #e6ebf5; --muted: #95a1b8; --line: #263149; --cell: #1c2538;

  --c3: #f4a165; --c3-soft: #33251a; --c4: #9d94e6; --c4-soft: #252340;

    --s-grey-bg: #262d3a; --s-grey-fg: #b0b9c9; --chg: #f07cc4; --chg-bg: #3a1a30;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.4;
}
.page {
  max-width: 1440px;
  margin: 0 auto;
  padding-inline: clamp(16px, 2.5vw, 32px);
  padding-block: 28px 40px;
  display: grid;
  gap: 22px;
}

/* Шапка */
.head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px 32px;
}
.head h1 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 800;
  font-size: clamp(28px, 3.6vw, 46px);
  letter-spacing: -0.02em;
  line-height: 1.05;
  text-wrap: balance;
}
.head .sub {
  margin: 6px 0 0;
  color: var(--muted);
  font-family: var(--f-display);
  font-weight: 600;
  font-size: clamp(16px, 1.6vw, 21px);
}
.org {
  border-left: 2px solid var(--line);
  padding-left: 16px;
  display: grid;
  gap: 2px;
}
.org b { font-family: var(--f-display); font-size: 17px; }
.org span { color: var(--muted); font-size: 14px; }
.org .date { color: var(--ink); font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }

/* Сетка блоков */
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
  align-items: start;
}
@media (max-width: 1080px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.block {
  --c: var(--c1); --soft: var(--c1-soft);
  background: linear-gradient(180deg, var(--soft), var(--panel) 160px);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 22px;
  display: grid;
  gap: 18px;
  min-width: 0;
}
.block[data-tone="2"] { --c: var(--c2); --soft: var(--c2-soft); }
.block[data-tone="3"] { --c: var(--c3); --soft: var(--c3-soft); }
.block[data-tone="4"] { --c: var(--c4); --soft: var(--c4-soft); }

.block-head {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr);
  align-items: center;
  gap: 18px;
}
.tile {
  width: 72px; height: 62px;
  border-radius: 14px;
  background: var(--c);
  color: #fff;
  display: grid;
  place-items: center;
}
.tile svg { width: 34px; height: 34px; }
.num {
  font-family: var(--f-display);
  font-weight: 800;
  font-size: 46px;
  line-height: 1;
  color: var(--c);
  font-variant-numeric: tabular-nums;
}
.block-head h2 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 800;
  font-size: 22px;
  text-wrap: balance;
}
.block-head p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }

/* Таблица */
.table {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
.row {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 0.85fr);
  align-items: center;
  border-top: 1px solid var(--line);
}
.row > div { padding: 10px 14px; min-width: 0; }
.row > div + div { border-left: 1px solid var(--line); align-self: stretch; display: flex; align-items: center; }
.row.th {
  border-top: 0;
  background: var(--soft);
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 14px;
}
.row.th > div + div { justify-content: center; }

.svc { display: flex; align-items: center; gap: 12px; }
.svc .ic {
  flex: none;
  width: 38px; height: 38px;
  border-radius: 10px;
  background: var(--cell);
  color: var(--ink);
  display: grid; place-items: center;
}
.svc .ic svg { width: 22px; height: 22px; }
.svc .step {
  flex: none;
  width: 38px; height: 30px;
  border-radius: 8px;
  background: var(--soft);
  color: var(--c);
  font-family: var(--f-display);
  font-weight: 800;
  display: grid; place-items: center;
  font-variant-numeric: tabular-nums;
}
.svc .name { font-weight: 700; color: var(--ink); }
.block[data-tone="3"] .svc .name, .block[data-tone="2"] .svc .name, .block[data-tone="4"] .svc .name { color: var(--ink); }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 10px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.2;
  background: var(--s-blue-bg);
  color: var(--s-blue-fg);
}
.pill::before {
  content: "";
  flex: none;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: currentColor;
}
.pill[data-s="green"]  { background: var(--s-green-bg);  color: var(--s-green-fg); }
.pill[data-s="yellow"]   { background: var(--s-yellow-bg);   color: var(--s-yellow-fg); }
.pill[data-s="blue"]  { background: var(--s-blue-bg);  color: var(--s-blue-fg); }
.pill[data-s="red"] { background: var(--s-red-bg); color: var(--s-red-fg); }
.pill[data-s="violet"]  { background: var(--s-violet-bg);  color: var(--s-violet-fg); }
.pill[data-s="teal"]   { background: var(--s-teal-bg);   color: var(--s-teal-fg); }
.pill[data-s="grey"]   { background: var(--s-grey-bg);   color: var(--s-grey-fg); }
.pill .n { font-variant-numeric: tabular-nums; }

.due {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.due svg { width: 16px; height: 16px; flex: none; color: var(--muted); }
.due.tbd { color: var(--muted); font-weight: 400; font-style: italic; }

/* Режим редактирования */
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.tools .note { color: var(--muted); font-size: 13px; margin-right: auto; }
.btn {
  font: 700 14px/1 var(--f-display);
  padding: 10px 16px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn:disabled { opacity: .55; cursor: default; }
.btn:focus-visible, .field:focus-visible { outline: 2px solid var(--c1); outline-offset: 2px; }
.edit-cell { display: grid; gap: 6px; width: 100%; }
.field {
  width: 100%;
  min-width: 0;
  font: 14px/1.3 var(--f-body);
  padding: 7px 9px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--cell);
  color: var(--ink);
}
.field.date-field { width: auto; max-width: 160px; font-weight: 700; }
.editing .block { box-shadow: 0 0 0 2px var(--line) inset; }

/* Отметка изменений */
.legend {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  font-size: 14px; color: var(--muted);
}
.legend .sw {
  display: inline-block; width: 28px; height: 16px; border-radius: 4px;
  background: var(--chg-bg); box-shadow: inset 3px 0 0 var(--chg); vertical-align: -3px; margin-right: 8px;
}
.legend b { color: var(--ink); }
.row > div.chg { background: var(--chg-bg); box-shadow: inset 3px 0 0 var(--chg); }
.cellwrap { display: grid; gap: 5px; justify-items: start; min-width: 0; width: 100%; }
.was { font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.was s { text-decoration-color: var(--chg); }
.tag {
  display: inline-block; margin-top: 4px;
  font: 800 10.5px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase;
  color: var(--chg); border: 1px solid var(--chg); border-radius: 5px; padding: 3px 5px;
}
.svc .name-wrap { display: grid; justify-items: start; min-width: 0; }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; }
.swatches input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.swatches label {
  width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
  border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line);
}
.swatches input:checked + label { box-shadow: 0 0 0 2px var(--ink); }
.swatches input:focus-visible + label { outline: 2px solid var(--c1); outline-offset: 2px; }

@media (max-width: 620px) {
  .block { padding: 16px; }
  .block-head { grid-template-columns: auto minmax(0, 1fr); gap: 12px 14px; }
  .block-head .num { display: none; }
  .tile { width: 54px; height: 48px; }
  .tile svg { width: 26px; height: 26px; }
  .row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .row > div:first-child { grid-column: 1 / -1; }
  .row > div + div { border-top: 1px dashed var(--line); }
  .row > div:nth-child(2) { border-left: 0; }
  .row.th > div:first-child { display: none; }
  .row.th > div:nth-child(2) { border-top: 0; border-left: 0; }
  .row.th > div:nth-child(3) { border-top: 0; }
}
</style>

   color: green | yellow | blue | red | violet | teal | grey — цвет плашки; label — текст статуса;

const clone = (o) => JSON.parse(JSON.stringify(o));
const keyOf = (bi, it) => bi + "|" + it.name;

// Снимок отчёта для сравнения со следующим
function snapshot(d) {

}

  book: '<path d="M12 6c-2-1.5-5-2-8-1.5V19c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V4.5c-3-.5-6 0-8 1.5z"/><path d="M12 6v14.5"/>',
  cart: '<path d="M3 4h2.5l2.2 10.5h10.6L20.5 7H7"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
  doc: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
  search: '<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/>',
  folder: '<path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/><path d="M3 10.5h18"/>',
  palette: '<path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1.3-1-1.6-1-2.6 0-.9.7-1.5 1.6-1.5H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.1"/><circle cx="10" cy="7.3" r="1.1"/><circle cx="14.5" cy="7.3" r="1.1"/>',
  report: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  cal: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
};
const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k] || ""}</svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render() {
  const d = draft || DATA;
  const editing = !!draft;
  const base = baselineFor(d);
  document.getElementById("page").classList.toggle("editing", editing);

  document.getElementById("report-date").innerHTML = editing
    ? `<label>Отчёт на <input class="field date-field" id="f-date" value="${esc(d.reportDate)}" aria-label="Дата отчёта"></label>`
    : "Отчёт на " + esc(d.reportDate);

  let changed = 0;
  document.getElementById("grid").innerHTML = d.blocks.map((b, bi) => {
    const rows = b.items.map((it, ii) => {
      const lead = b.numbered
        ? `<span class="step">${String(ii + 1).padStart(2, "0")}</span>`
        : `<span class="ic">${svg(it.icon)}</span>`;
      const key = `${bi}-${ii}`;
      const ch = diff(base, bi, it);
      if (ch) changed++;
      const tag = ch ? `<span class="tag">${ch.isNew ? "Новая работа" : "Изменено"}</span>` : "";
      let status, due;
      if (editing) {
        const sw = Object.keys(COLORS).map((c) =>
          `<input type="radio" name="c-${key}" id="c-${key}-${c}" value="${c}" data-b="${bi}" data-i="${ii}" data-f="color"${c === it.color ? " checked" : ""}>` +
          `<label for="c-${key}-${c}" title="${COLORS[c]}" style="background: var(--s-${c}-fg)"><span hidden>${COLORS[c]}</span></label>`).join("");
        status = `<div class="edit-cell">
          <div class="swatches" role="radiogroup" aria-label="Цвет статуса">${sw}</div>
          <input class="field" id="l-${key}" data-b="${bi}" data-i="${ii}" data-f="label" value="${esc(it.label)}" placeholder="Текст статуса" aria-label="Текст статуса">
        </div>`;
        due = `<input class="field" id="d-${key}" data-b="${bi}" data-i="${ii}" data-f="due" value="${esc(it.due)}" placeholder="напр. 16.10.2026" aria-label="Плановый срок">`;
      } else {
        status = `<span class="pill" data-s="${esc(it.color)}">${esc(it.label)}</span>`;
        due = norm(it.due)
          ? `<span class="due">${svg("cal")}${esc(it.due)}</span>`
          : `<span class="due tbd">${svg("cal")}Срок уточняется</span>`;
      }
      if (ch && ch.status) status += `<span class="was">было: <s>${esc(ch.prev.label || "—")}</s></span>`;
      if (ch && ch.due) due += `<span class="was">было: <s>${esc(ch.prev.due || "не задан")}</s></span>`;
      const sc = ch && (ch.status || ch.isNew) ? ' class="chg"' : "";
      const dc = ch && (ch.due || ch.isNew) ? ' class="chg"' : "";
      return `<div class="row">
        <div class="svc">${lead}<span class="name-wrap"><span class="name">${esc(it.name)}</span>${tag}</span></div>
        <div${sc}><div class="cellwrap">${status}</div></div>
        <div${dc}><div class="cellwrap">${due}</div></div>
      </div>`;
    }).join("");
    return `<article class="block" data-tone="${bi + 1}">
      <div class="block-head">
        <div class="tile">${svg(b.icon)}</div>
        <div class="num">${String(bi + 1).padStart(2, "0")}</div>
        <div><h2>${esc(b.title)}</h2><p>${esc(b.desc)}</p></div>
      </div>
      <div class="table" role="table">
        <div class="row th" role="row"><div>Сервисы / работы</div><div>Статус</div><div>Плановые сроки</div></div>
        ${rows}
      </div>
    </article>`;
  }).join("");

  const legend = document.getElementById("legend");
  legend.hidden = !base;
  if (base) {
    legend.innerHTML = changed
      ? `<span><span class="sw"></span>Выделены изменения с отчёта от <b>${esc(base.date)}</b></span><span>Изменено работ: <b>${changed}</b></span>`
      : `<span>С отчёта от <b>${esc(base.date)}</b> изменений нет</span>`;
  }

  renderTools();
}

function renderTools(note) {
  const tools = document.getElementById("tools");
  if (!artifactApi) { tools.hidden = true; return; }
  tools.hidden = false;
  const hint = `Пишите статус любым текстом и выбирайте цвет. Для нового еженедельного отчёта поменяйте дату: изменения подсветятся относительно отчёта от ${esc(DATA.reportDate)}.`;
  tools.innerHTML = draft
    ? `<span class="note">${note || hint}</span>
       <button class="btn" id="b-cancel" type="button">Отмена</button>
       <button class="btn primary" id="b-save" type="button">Сохранить</button>`
    : `<button class="btn" id="b-edit" type="button">Редактировать</button>`;
}

document.addEventListener("click", async (e) => {
  const id = e.target.id;
  if (id === "b-edit") { draft = JSON.parse(JSON.stringify(DATA)); render(); }
  if (id === "b-cancel") { draft = null; render(); }
  if (id === "b-save") await save();
});

let rerenderTimer = null;
document.addEventListener("input", (e) => {
  const t = e.target;
  if (!draft) return;
  if (t.id === "f-date") draft.reportDate = t.value;
  else if (t.dataset.f) draft.blocks[+t.dataset.b].items[+t.dataset.i][t.dataset.f] = t.value;
  else return;
  // подсветку обновляем после паузы в наборе, сохраняя фокус в поле
  clearTimeout(rerenderTimer);
  rerenderTimer = setTimeout(() => {
    const id = document.activeElement && document.activeElement.id;
    const pos = document.activeElement && document.activeElement.selectionStart;
    render();
    const el = id && document.getElementById(id);
    if (el) { el.focus(); if (pos != null && el.setSelectionRange) try { el.setSelectionRange(pos, pos); } catch (_) {} }
  }, t.type === "radio" ? 0 : 600);
});

function buildDocument(data) {
  const json = JSON.stringify(data, null, 1).replace(/</g, "\\u003c");
  return SKELETON + "\n" + HEAD +
    document.getElementById("page-style").outerHTML + "\n\n" +
    SHELL + "\n\n" +
    '<script type="application/json" id="report-data">\n' + json + "\n<\/script>\n\n" +
    '<script id="app">' + document.getElementById("app").textContent + "<\/script>\n" +
    "</body></html>";
}

async function save() {
  const btn = document.getElementById("b-save");
  btn.disabled = true; btn.textContent = "Сохраняю…";
  const next = clone(draft);
  next.baseline = baselineFor(next);
  next.blocks.forEach((b) => b.items.forEach((it) => { it.label = norm(it.label); it.due = norm(it.due); }));
  try {
    await artifactApi.publish(buildDocument(next));
    // страница перезагрузится на новую версию
  } catch (err) {
    const code = err && err.code;
    if (code === "conflict") return; // страница перезагрузится на более свежую версию
    if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "consent_required") {
      draft = null; artifactApi = null; render(); return;
    }
    renderTools(code === "rate_limited"
      ? "Слишком частые сохранения. Подождите минуту и нажмите «Сохранить» ещё раз."
      : "Не удалось сохранить. Проверьте соединение и попробуйте ещё раз.");
  }
}

render();

(async () => {
  if (!window.claude || !window.claude.use) return;
  const [api, user] = await Promise.all([window.claude.use("artifact"), window.claude.use("user")]);
  if (!api) return;
  if (user && user.canEdit && (await user.canEdit()) === false) return; // просмотр без права правки
  artifactApi = api;
  renderTools();
})();
</script>
